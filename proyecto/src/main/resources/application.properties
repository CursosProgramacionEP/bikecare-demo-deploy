spring.application.name=proyecto

# --- Secretos locales ---
spring.config.import=optional:file:./.env[.properties],optional:file:./proyecto/.env[.properties]

# --- Base de datos ---
# PostgreSQL: en local se usa la base bikecare_db; en la nube, DB_URL con la cadena "Java" de Neon
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bikecare_db}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# El dialecto de PostgreSQL lo detecta Hibernate automáticamente (se quitó MySQLDialect)

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB

bikecare.shared.default-redirect=/welcome

# --- Servidor (Render asigna PORT y pone un proxy HTTPS delante) ---
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# --- Recuperacion de contrasenia (HU-17) ---
app.base-url=${APP_URL:http://localhost:8080}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Diagnóstico IA con Gemini ---
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash