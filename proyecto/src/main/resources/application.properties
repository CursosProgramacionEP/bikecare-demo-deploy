spring.application.name=proyecto

# --- Secretos locales ---
spring.config.import=optional:file:./.env[.properties],optional:file:./proyecto/.env[.properties]

# --- Base de datos ---
spring.datasource.url=jdbc:mysql://localhost:3306/bikecare_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB

bikecare.shared.default-redirect=/welcome

# --- Recuperacion de contrasenia (HU-17) ---
app.base-url=http://localhost:8080
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Diagnóstico IA con Gemini ---
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash