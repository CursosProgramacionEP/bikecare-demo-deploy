<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeCare | Restablecer contraseña</title>
    <link rel="stylesheet" th:href="@{/css/styleIndex.css}">
</head>

<body>
    <th:block th:replace="~{fragments/alerts :: messages}"></th:block>

    <div class="login-conteiner">
        <div class="login-card">
            <header class="login-header">
                <img th:src="@{/img/logo-bikecare.jpeg}" alt="">
                <h1>Restablecer contraseña</h1>
                <p class="login-subtitulos">Ingresa tu nueva contraseña</p>
            </header>

            <form th:action="@{/reset-password}" class="login-form" method="post">
                <input type="hidden" name="token" th:value="${token}">

                <div class="grupo-formulario">
                    <label for="contrasenia">Nueva contraseña</label>
                    <input type="password" name="contrasenia" id="contrasenia" placeholder="Mínimo 8 caracteres" required minlength="8">
                </div>

                <div class="grupo-formulario">
                    <label for="confirmar">Confirmar contraseña</label>
                    <input type="password" name="confirmar" id="confirmar" placeholder="Repite la contraseña" required minlength="8">
                </div>

                <button type="submit" class="btn-submit">Restablecer contraseña</button>
            </form>

            <footer class="login-footer">
                <p><a th:href="@{/login}">Volver a iniciar sesión</a></p>
            </footer>
        </div>
    </div>
</body>

</html>
