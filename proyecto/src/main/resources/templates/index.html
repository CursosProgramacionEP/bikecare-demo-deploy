<!DOCTYPE html>
<html lang="en">

<head>
    <html xmlns="https://www.thymeleaf.org">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeCare | Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/styleIndex.css}">
</head>

<body>
    <th:block th:replace="~{fragments/alerts :: messages}"></th:block>

    <div class="login-conteiner">
        <div class="login-card">
            <header class="login-header">
                <img th:src="@{/img/logo-bikecare.jpeg}" alt="">
                <h1>Iniciar sesion</h1>
                <p class="login-subtitulos">Bienvenido de nuevo, ingresa tus datos</p>
            </header>

            <div class="alerta-error" th:if="${param.error}" role="alert" style="color:#dc2626; font-size: 12px;">
                Correo o contraseña incorrectos*.
            </div>
            
            <p th:if="${param.bloqueado}" class="error">
                Cuenta bloqueada por demasiados intentos fallidos. Intenta de nuevo en 24 horas.
            </p>

            <form th:action="@{/login}" class="login-form" method="post">

                <div class="grupo-formulario">
                    <label for="email">Correo electrónico</label>
                    <input type="email" name="correo" id="email" placeholder="tucorreo@ejemplo.com" required>
                </div>

                <div class="grupo-formulario">
                    <label for="password">Contraseña</label>
                    <input type="password" name="contrasenia" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit">Iniciar sesión</button>

            </form>

            <footer class="login-footer">
                <p>¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a></p>
                <p><a th:href="@{/forgot-password}">¿Olvidaste tu contraseña?</a></p>
            </footer>
        </div>
    </div>
</body>

</html>
