<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeCare | Recuperar contraseña</title>
    <link rel="stylesheet" th:href="@{/css/styleIndex.css}">
</head>

<body>
    <th:block th:replace="~{fragments/alerts :: messages}"></th:block>

    <div class="login-conteiner">
        <div class="login-card">
            <header class="login-header">
                <img th:src="@{/img/logo-bikecare.jpeg}" alt="">
                <h1>Recuperar contraseña</h1>
                <p class="login-subtitulos">Ingresa tu correo y te enviaremos un enlace</p>
            </header>

            <form th:action="@{/forgot-password}" class="login-form" method="post">
                <div class="grupo-formulario">
                    <label for="email">Correo electrónico</label>
                    <input type="email" name="correo" id="email" placeholder="tucorreo@ejemplo.com" required>
                </div>

                <button type="submit" class="btn-submit">Enviar enlace</button>
            </form>

            <footer class="login-footer">
                <p><a th:href="@{/login}">Volver a iniciar sesión</a></p>
            </footer>
        </div>
    </div>
</body>

</html>
