<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BikeCare · Pagos pendientes</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1f2933; }
        header { background: #0f766e; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #fff; text-decoration: underline; }
        main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e4e7eb; }
        th { background: #eef2f5; font-size: .85rem; }
        .vacio { background: #fff; padding: 24px; border-radius: 8px; text-align: center; }
        .btn-aprobar { background: #0f766e; color: #fff; border: 0; padding: 7px 14px; border-radius: 6px; cursor: pointer; }
        .btn-aprobar:hover { background: #115e59; }
    </style>
</head>
<body>
    <header>
        <strong>Panel de administración · Pagos</strong>
        <span><span th:text="${usuario?.correo}">admin</span> · <a th:href="@{/welcome}">Ir al inicio</a></span>
    </header>

    <main>
        <th:block th:replace="~{fragments/alerts :: messages}"></th:block>

        <h2>Pagos pendientes de verificación</h2>

        <div class="vacio" th:if="${pagosPendientes == null or pagosPendientes.isEmpty()}">No hay pagos pendientes.</div>

        <table th:unless="${pagosPendientes == null or pagosPendientes.isEmpty()}">
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Correo</th>
                    <th>Método</th>
                    <th>N° de operación</th>
                    <th>Registrado</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <!-- Se accede a los datos del usuario mediante p.usuario?.nombre y p.usuario?.correo -->
                <tr th:each="p : ${pagosPendientes}">
                    <td th:text="${p.usuario?.nombre}">Nombre</td>
                    <td th:text="${p.usuario?.correo}">correo@x.com</td>
                    <td th:text="${p.tipo}">Yape</td>
                    <td><code th:text="${p.numeroOperacion}">ABC12345</code></td>
                    <td th:text="${p.fechaRegistro != null ? #temporals.format(p.fechaRegistro, 'dd/MM/yyyy HH:mm') : '-'}">01/01/2026 10:00</td>
                    <td>
                        <form th:action="@{/admin/pagos/aprobar/{id}(id=${p.idMetodoPago})}" method="post">
                            <button type="submit" class="btn-aprobar">Aprobar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
