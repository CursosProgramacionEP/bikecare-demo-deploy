<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeCare | Crear cuenta</title>
    <link rel="stylesheet" th:href="@{/css/styleRegistro.css}">
</head>

<body>
    <div class="register-conteiner">

        <div class="register-card">
            <header>
                <img th:src="@{/img/logo-bikecare.jpeg}" alt="">
                <h1>Crear cuenta</h1>
                <p class="register-subtitle">Completa tus datos para empezar</p>
            </header>

            <p th:if="${param.existe}" class="error-message" role="alert" style="display:block;margin-bottom:12px">Ya existe una cuenta con ese correo. Inicia sesión o usa otro correo.</p>
            <form th:action="@{/registrar}" method="post" class="register-form">
                <div class="form-group">
                    <label for="firstname">Nombre</label>
                    <input type="text" id="firstname" name="nombre" placeholder="Juan" autocomplete="given-name"
                        required>
                    <span class="error-message" id="firstname-error" role="alert"></span>
                </div>

                <div class="form-group">
                    <label for="lastname">Apellido</label>
                    <input type="text" id="lastname" name="apellidos" placeholder="Pérez" autocomplete="family-name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="correo" placeholder="tucorreo@ejemplo.com" autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>

                    <input type="password" id="password" name="contrasenia" placeholder="Mínimo 8 caracteres"
                        autocomplete="new-password" minlength="8" required>
                    <small id="passwordErrorLenght" style="color:#dc2626; display:none;"></small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmarContrasenia"
                        placeholder="Repite tu contraseña" required>
                    <small id="passwordError" style="color:#dc2626; display:none;"></small>

                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span>Acepto los <a href="/terms">Términos y condiciones</a> y la <a href="/privacy">Política de
                                privacidad</a></span>
                    </label>
                </div>
                <button type="submit" class="btn-submit">Crear cuenta</button>
            </form>


            <footer class="register-footer">
                <p>¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a></p>
            </footer>
        </div>

    </div>
    
    <script th:src="@{/js/validarContra.js}"></script>
</body>

</html>
