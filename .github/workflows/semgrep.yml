name: Semgrep

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    name: Análisis estático
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.185.0
    steps:
      - uses: actions/checkout@v5

      - name: Ejecutar Semgrep
        # Cuando el análisis esté limpio, añade --error para que bloquee el PR.
        run: >
          semgrep scan
          --config p/java
          --config p/owasp-top-ten
          --metrics=off
          --sarif --output=semgrep.sarif
          proyecto/src

      - name: Publicar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
